# Sets display name for the job.
# https://nightexpressdev.com/nightcore/configuration/text-formation/
Name: '[lang].jobs.name.lumberjack[/lang] [lang].rank.clasp.e[/lang]'
# Set description for the job.
# https://nightexpressdev.com/nightcore/configuration/text-formation/
Description:
- '[lang].jobs.lore.lumberjack.1[/lang]'
- '[lang].jobs.lore.lumberjack.2[/lang]'
# Set icon for the job.
# https://nightexpressdev.com/nightcore/configuration/item-formation/
Icon:
  Material: minecraft:iron_axe
  Lore: []
# When enabled, players must have 'excellentjobs.job.lumberjack' permission in order to use this job.
Permission_Required: true
ProgressBar:
  # Sets color for this job progress bar.
  # Allowed values: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  Color: GREEN
# Assigns the job with specified state for new players joined for the first time.
# https://nightexpressdev.com/excellentjobs/jobs/auto-join
# [Allowed values: PRIMARY, SECONDARY, INACTIVE]
# [Default is INACTIVE]
Initial_State: INACTIVE
# The job will have no effect in listed worlds (no XP and Income).
# https://nightexpressdev.com/excellentjobs/jobs/disabled-worlds
Disabled_Worlds: []
General:
  # https://nightexpressdev.com/excellentjobs/jobs/leave-join-commands
  JoinCommands: []
  # https://nightexpressdev.com/excellentjobs/jobs/leave-join-commands
  LeaveCommands: []
Leveling:
  # Defines max. possible job level if picked as Primary job.
  # https://nightexpressdev.com/excellentjobs/jobs/leveling
  Max_Level: 100
  # Defines initial value for the geometric XP progression.
  # https://nightexpressdev.com/excellentjobs/jobs/leveling
  XP_Initial: 200
  # Defines step value for the geometric XP progression.
  # https://nightexpressdev.com/excellentjobs/jobs/leveling
  XP_Factor: 1.0584421
  # Leveling rewards.
  # https://nightexpressdev.com/excellentjobs/jobs/level-rewards
  Rewards:
    List:
      lvl_25:
        Levels: '25'
        Repeatable: false
        Name: '[lang].jobs.lumberjack_e.rewards.25[/lang]'
        Description: []
        Commands:
        - lp user %player_name% parent settrack lumberjack_e lumberjack_e_25
        Required_Permission: 'null'
        Required_Ranks: []
        RequirementInfo: []
        Required_States: []
      lvl_50:
        Levels: '50'
        Repeatable: false
        Name: '[lang].jobs.lumberjack_e.rewards.50[/lang]'
        Description: []
        Commands:
        - lp user %player_name% parent settrack lumberjack_e lumberjack_e_50
        Required_Permission: 'null'
        Required_Ranks: []
        RequirementInfo: []
        Required_States: []
      lvl_75:
        Levels: '75'
        Repeatable: false
        Name: '[lang].jobs.lumberjack_e.rewards.75[/lang]'
        Description: []
        Commands:
        - lp user %player_name% parent settrack lumberjack_e lumberjack_e_75
        Required_Permission: 'null'
        Required_Ranks: []
        RequirementInfo: []
        Required_States: []
      lvl_100:
        Levels: '100'
        Repeatable: false
        Name: '[lang].jobs.lumberjack_e.rewards.100[/lang]'
        Description: []
        Commands:
        - lp user %player_name% parent settrack lumberjack_e lumberjack_e_100
        Required_Permission: 'null'
        Required_Ranks: []
        RequirementInfo: []
        Required_States: []
    Modifiers:
      money:
        Base: 0.0
        Per_Level: 1000.0
        Step: 1.0
        Action: ADD


Daily_Limits:
  # Defines daily Income limits on per currency basis.
  # You can use the 'default' keyword for all currencies that are not listed here.
