      Currency: <gray>Enter <green>[Currency Identifier]</green></gray>
      Material: <gray>Enter <green>[Material Name]</green></gray>
  Zone:
    Enter:
      Description: <gray>Enter <green>[Description Line]</green></gray>
      JobId: <gray>Enter <green>[Job Identifier]</green></gray>
