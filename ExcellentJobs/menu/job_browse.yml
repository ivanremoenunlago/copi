Job:
  Name: <white>%job_name%</white>
  Lore:
    Join:
    - '%job_description%'
    - '%empty-if-above%'
    - <white><sprite:"items":"item/paper"></white> <c:#15A2E8><b>Statistics:</b></c>
    - <dark_gray> » </dark_gray><gray>Employees:</gray> <c:#15A2E8>{employees}</c>
    - <dark_gray> » </dark_gray><gray>You Top:</gray> <c:#15A2E8>Join to start compete!</c>
    - ''
    - <if_can_join><soft_yellow>→ <u>Click to select contract</u></soft_yellow></if_can_join>
    - <if_can_not_join><soft_red>→ <u>You can't join this job</u></soft_red></if_can_not_join>
    Manage:
    - '%job_description%'
    - '%empty-if-above%'
    - <white><sprite:"items":"item/paper"></white> <c:#15A2E8><b>Statistics:</b></c>
    - <dark_gray> » </dark_gray><gray>Employees:</gray> <c:#15A2E8>{employees}</c>
    - <dark_gray> » </dark_gray><gray>You Top:</gray> <c:#15A2E8>#{top_level_position}</c>
    - ''
    - <white><sprite:"items":"item/experience_bottle"></white> <c:#A8E815><b>Leveling:</b></c>
    - <dark_gray> » </dark_gray><gray>XP:</gray> <c:#A8E815>{xp}<gray>/</gray>{xp_required}</c>
    - <dark_gray> » </dark_gray><gray>Level:</gray> <c:#A8E815>{level}<gray>/</gray>{max_level}</c>
    - ''
    - <white><sprite:"items":"item/book"></white> <c:#E8152E><b>Contract:</b></c>
    - <dark_gray> » </dark_gray><gray>Current:</gray> <c:#E8152E>{contract_name}</c>
    - <dark_gray> » </dark_gray><gray>Points:</gray> <c:#E8152E>{contract_points}</c>
    - ''
    - <gold>→ <u>Click to manage</u></gold>
